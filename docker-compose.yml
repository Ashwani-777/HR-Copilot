# Production-style run (needs Docker). For local dev see README.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: hr, POSTGRES_PASSWORD: hr, POSTGRES_DB: hr_copilot }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hr:hr@db:5432/hr_copilot
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
  frontend:
    build: ./frontend          # nginx: serves the SPA, proxies /api and /socket.io to backend:4100
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  pgdata:
